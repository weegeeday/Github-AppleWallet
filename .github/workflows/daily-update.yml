name: Daily Apple Wallet Pass Update

on:
  workflow_dispatch:
    inputs:
      force_create:
        description: 'Force create a brand new pass (re-issues serial)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update-pass:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pass updater
        env:
          WALLETWALLET_API_KEY: ${{ secrets.WALLETWALLET_API_KEY }}
          GH_USERNAME: ${{ vars.GH_USERNAME || secrets.GH_USERNAME || github.repository_owner }}
        run: |
          CMD_ARGS=""
          if [ "${{ inputs.force_create }}" = "true" ]; then
            CMD_ARGS="--force-create"
          fi
          python main.py $CMD_ARGS
